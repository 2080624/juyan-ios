# 聚言商聊 iOS 壳 · 工程配置（扁平结构版，手机上传最省事）
# 云端编译（GitHub Actions）会自动跑 xcodegen 生成 JuYan.xcodeproj；
# 你要在 Mac 的 Xcode 里用，也是先装 xcodegen 再在这个目录敲 xcodegen。
#
# 注意：这里故意不写 info: 段，避免生成工程时把 Info.plist 覆盖掉。
#       Info.plist 直接由 INFOPLIST_FILE 指向本目录的 Info.plist。
#
# 推送（aps-environment）：默认不启用。等你拿到苹果开发者账号（99 美元/年），
# 把下面 CODE_SIGN_ENTITLEMENTS 那行的 # 去掉，再用 Xcode 配好证书打包即可。

name: JuYan
options:
  bundleIdPrefix: com.juyan
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_BITCODE: NO
    CODE_SIGN_STYLE: Automatic

targets:
  JuYan:
    type: application
    platform: iOS
    sources:
      - AppDelegate.swift
      - WebShellViewController.swift
      - PushRegistrar.swift
    settings:
      base:
        PRODUCT_NAME: 聚言商聊
        PRODUCT_BUNDLE_IDENTIFIER: com.juyan.chat
        INFOPLIST_FILE: Info.plist
        # CODE_SIGN_ENTITLEMENTS: JuYan.entitlements
        DEVELOPMENT_TEAM: ""
    scheme:
      testTargets: []
